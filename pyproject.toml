[project]
name = "mario-decisions-agent"
version = "0.1.0"
description = "Screenshot-only Super Mario Bros agent driven by the OpenAI Decisions API (gpt-6-luna)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "requests>=2.31",
    "pillow>=10.0",
]

[project.optional-dependencies]
mario = [
    "gym-super-mario-bros>=7.4.0",
    "nes-py>=8.2.1",
    # gym 0.26 changed the step() API; nes-py still returns the old 4-tuple.
    "gym<0.26",
]

# Optional: `--record out.mp4` video writing (bundles its own ffmpeg).
record = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

# Optional: `python scripts/make_readme_pdf.py` (README.md -> styled PDF via Chrome).
docs = [
    "markdown>=3.5",
]

[project.scripts]
mda = "mda.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mda"]
