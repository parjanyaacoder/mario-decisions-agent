<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" width="1160" height="460" role="img" aria-label="The model takes about 0.2 seconds to answer. At 60 frames per second, 12 game frames pass while it thinks. At 15 frames per second, only 3 pass." font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="soft2" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1160" height="460" rx="26" fill="url(#bg2)"/>

  <text x="580" y="52" text-anchor="middle" font-size="29" font-weight="800" fill="#0f172a">The speed gap, in one picture</text>
  <text x="580" y="82" text-anchor="middle" font-size="15.5" fill="#64748b">The model takes about 0.20 s to think. Here&#8217;s how much game runs while it does.</text>

  <g filter="url(#soft2)">
    <rect x="300" y="116" width="616" height="46" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="608" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">the model is thinking &#8230;  &#8776; 0.2 seconds</text>

  <text x="44" y="214" font-size="34" font-weight="800" fill="#16a34a">60</text>
  <text x="44" y="236" font-size="14" fill="#15803d">fps &#8212; full speed</text>

  <g fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5">
    <rect x="300" y="196" width="44" height="46" rx="10"/>
    <rect x="352" y="196" width="44" height="46" rx="10"/>
    <rect x="404" y="196" width="44" height="46" rx="10"/>
    <rect x="456" y="196" width="44" height="46" rx="10"/>
    <rect x="508" y="196" width="44" height="46" rx="10"/>
    <rect x="560" y="196" width="44" height="46" rx="10"/>
    <rect x="612" y="196" width="44" height="46" rx="10"/>
    <rect x="664" y="196" width="44" height="46" rx="10"/>
    <rect x="716" y="196" width="44" height="46" rx="10"/>
    <rect x="768" y="196" width="44" height="46" rx="10"/>
    <rect x="820" y="196" width="44" height="46" rx="10"/>
    <rect x="872" y="196" width="44" height="46" rx="10"/>
  </g>
  <text x="300" y="272" font-size="14.5" font-weight="600" fill="#b91c1c">12 frames run while it thinks &#8212; Mario is blind, and usually dies</text>

  <text x="44" y="352" font-size="34" font-weight="800" fill="#16a34a">15</text>
  <text x="44" y="374" font-size="14" fill="#15803d">fps &#8212; slow motion</text>

  <g fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5">
    <rect x="300" y="334" width="44" height="46" rx="10"/>
    <rect x="352" y="334" width="44" height="46" rx="10"/>
    <rect x="404" y="334" width="44" height="46" rx="10"/>
  </g>
  <rect x="460" y="334" width="456" height="46" rx="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="688" y="362" text-anchor="middle" font-size="13.5" fill="#94a3b8">the rest of the game arrives after the answer</text>
  <text x="300" y="410" font-size="14.5" font-weight="600" fill="#15803d">only 3 frames run while it thinks &#8212; fast enough to react</text>
</svg>
